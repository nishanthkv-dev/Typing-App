name: Build Mobile Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble & Publish Mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Run Core QA Test Suites (JSDOM)
        run: |
          echo "=== 1. Senior QA Suite ==="
          node run_senior_qa_tests.js
          echo "=== 2. Notification Module Suite ==="
          node test_notification_module.js
          echo "=== 3. New Enhancements Suite ==="
          node test_new_enhancements.js
          echo "=== 4. Games Module Suite ==="
          node test_games_module.js
          echo "=== 5. OTG Physical Keyboard Suite ==="
          node test_otg_keyboard.js
          echo "=== 6. Latest Features & UI Fixes Suite ==="
          node test_latest_features.js
          echo "=== 7. User Access, Google Auth & Single-Device Security Suite ==="
          node test_auth_and_access.js
          echo "=== 8. Games, KeyMap & Drills Overhaul Suite ==="
          node test_games_and_drills_overhaul.js
          echo "=== 9. Keyboard Connect, Tester & Gov Jobs Suite ==="
          node test_new_features.js
          echo "=== 10. Bubble Word Challenge & Bottom Nav Fixes Suite ==="
          node test_bubble_and_bottom_nav_fixes.js
          echo "=== 11. Game Enhancements Suite ==="
          node test_game_enhancements_suite.js

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble Debug APK & App Bundle with Gradle
        working-directory: android
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Prepare Named Mobile APK & AAB
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TypingThalaiva-OTG-Mobile.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab TypingThalaiva-Mobile.aab
          ls -lh TypingThalaiva-OTG-Mobile.apk TypingThalaiva-Mobile.aab

      - name: Upload APK & AAB as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TypingThalaiva-Mobile-Builds
          path: |
            TypingThalaiva-OTG-Mobile.apk
            TypingThalaiva-Mobile.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct Mobile Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: mobile-latest
          name: "Typing Thalaiva — OTG Mobile Release (Latest)"
          body: |
            ### 📱 Typing Thalaiva — Mobile Test Build & Play Store Bundle
            **Branding:** Powered by K V N Techno Labs | Sri Kalaimagal Technical Institute
            
            #### 🚀 Release Features:
            - **DoTE Examination Engine:** Specially designed for DoTE Typewriting Examination preparation (Tamil & English Junior/Senior).
            - **Google Sign-In & Secure Entitlements:** Free Forever guest access for 2 passages per language, with Google Auth only required for course upgrades.
            - **Single-Device Protection:** Immediate automatic revocation on concurrent device logins.
            - **OTG Physical Keyboard Support:** Full support for USB keyboards connected via OTG with automatic soft keyboard suppression.
            - **Arcade Games & Anti-Choke Mode:** Bubble Words & Falling Words with progressive speed and Tamil99/Typewriter support.
            - **Play Store Compliance:** Built-in Privacy Policy modal and user account/data deletion.
            
            #### 📥 Direct Installation:
            Download **`TypingThalaiva-OTG-Mobile.apk`** below directly onto your Android smartphone and tap to install.
            For Play Console testing, **`TypingThalaiva-Mobile.aab`** is also generated.
          draft: false
          prerelease: false
          files: |
            TypingThalaiva-OTG-Mobile.apk
            TypingThalaiva-Mobile.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
