name: Build Mobile Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble & Publish Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Senior QA Automated Test Suite
        run: node run_senior_qa_tests.js

      - name: Run Notification Module Test Suite
        run: node test_notification_module.js

      - name: Run New Enhancements Test Suite
        run: node test_new_enhancements.js

      - name: Run Games Module Test Suite
        run: node test_games_module.js

      - name: Run OTG Physical Keyboard Test Suite
        run: node test_otg_keyboard.js

      - name: Run Playwright Layout & Responsiveness QA Suite
        run: npm run qa

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Named Mobile APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TypingThalaiva-OTG-Mobile.apk
          ls -lh TypingThalaiva-OTG-Mobile.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingThalaiva-OTG-Mobile-APK
          path: TypingThalaiva-OTG-Mobile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct Mobile Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: mobile-latest
          name: "Typing Thalaiva — OTG Mobile Release (Latest)"
          body: |
            ### 📱 Typing Thalaiva — Mobile Test Build
            **Branding:** Powered by K V N Techno Labs | Sri Kalaimagal Technical Institute
            
            #### 🚀 Highlights:
            - **OTG Physical Keyboard Support:** Full support for USB keyboards connected via OTG.
            - **Automatic Soft Keyboard Suppression:** Virtual keyboard will not pop up and cover the screen when an OTG keyboard is active.
            - **DoTE Examination Engine:** Tamil & English (Junior & Senior) with official stroke limit formulas.
            - **Arcade Games & Anti-Choke Mode:** Bubble Words & Falling Words with Tamil99 & Typewriter support.
            - **Local Notification Alerts:** Daily practice reminders and milestone alerts.
            
            #### 📥 Direct Installation:
            Download **`TypingThalaiva-OTG-Mobile.apk`** below directly onto your Android smartphone and tap to install.
          draft: false
          prerelease: false
          files: TypingThalaiva-OTG-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
