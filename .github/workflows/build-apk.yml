name: Build Mobile Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble & Publish Mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Run Core QA Test Suites (JSDOM)
        run: |
          echo "=== 1. Senior QA Suite ==="
          node run_senior_qa_tests.js
          echo "=== 2. Notification Module Suite ==="
          node test_notification_module.js
          echo "=== 3. New Enhancements Suite ==="
          node test_new_enhancements.js
          echo "=== 4. Games Module Suite ==="
          node test_games_module.js
          echo "=== 5. OTG Physical Keyboard Suite ==="
          node test_otg_keyboard.js
          echo "=== 6. Latest Features & UI Fixes Suite ==="
          node test_latest_features.js

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Named Mobile APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TypingThalaiva-OTG-Mobile.apk
          ls -lh TypingThalaiva-OTG-Mobile.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingThalaiva-OTG-Mobile-APK
          path: TypingThalaiva-OTG-Mobile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct Mobile Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: mobile-latest
          name: "Typing Thalaiva — OTG Mobile Release (Latest)"
          body: |
            ### 📱 Typing Thalaiva — Mobile Test Build
            **Branding:** Powered by K V N Techno Labs | Sri Kalaimagal Technical Institute
            
            #### 🚀 Release Features:
            - **OTG Physical Keyboard Support:** Full support for USB keyboards connected via OTG.
            - **Automatic Soft Keyboard Suppression:** Virtual keyboard will not pop up and cover the screen when an OTG keyboard is active.
            - **DoTE Examination Engine:** Tamil & English (Junior & Senior) with official stroke limit formulas.
            - **Arcade Games & Anti-Choke Mode:** Bubble Words & Falling Words with Tamil99 & Typewriter support.
            - **Local Notification Alerts:** Daily practice reminders and milestone alerts.
            
            #### 📥 Direct Installation:
            Download **`TypingThalaiva-OTG-Mobile.apk`** below directly onto your Android smartphone and tap to install.
          draft: false
          prerelease: false
          files: TypingThalaiva-OTG-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
